name: Build and Release Windows Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 消除 Node 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 移除了 'npm install -g yarn' 这一步

      - name: Install Dependencies
        run: npm install
        env:
          # 加速 Electron 下载
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          npm_config_fetch_timeout: 120000

      - name: Compile Source Code
        # 使用 npm run 替代 yarn
        # 注意：VS Code 系项目通常有 compile 脚本，如果没有，请改回 npm run watch
        run: npm run compile

      - name: Build Windows Archive (ZIP)
        run: npx gulp vscode-win32-x64-archive

      - name: Build Windows Setup (EXE)
        run: npx gulp vscode-win32-x64-setup

      # 调试步骤：打印出构建产物的具体路径，方便排查上传路径是否正确
      - name: List build artifacts
        run: |
          Get-ChildItem -Path .\.build -Recurse -File | Select-Object FullName
        shell: pwsh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/win32-x64/archive/*.zip
            .build/win32-x64/system-setup/*.exe
          fail_on_unmatched_files: true
