name: Build and Release Windows Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          npm_config_fetch_timeout: 120000

      - name: Build React UI Components
        run: npm run buildreact

      - name: Compile Source Code
        run: npm run compile

      # ==========================================
      # 修改了这里的 gulp 任务名称
      # ==========================================

      - name: Build Windows
        run: npx gulp vscode-win32-x64-ci

      - name: Build Inno Updater
        run: npx gulp vscode-win32-x64-inno-updater

      - name: Create ZIP archive
        run: |
          $version = (Get-Content -Raw -Path package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path .build\win32-x64 -Force
          7z.exe a -tzip ".build\win32-x64\VSCode-win32-x64-$version.zip" "..\VSCode-win32-x64\*"
        shell: pwsh

      - name: Build Windows User Setup (EXE)
        run: npx gulp vscode-win32-x64-user-setup

      # 调试步骤：打印出构建产物的具体路径，方便排查上传路径是否正确
      - name: List build artifacts
        run: |
          Get-ChildItem -Path .\.build -Recurse -File | Select-Object FullName
        shell: pwsh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/win32-x64/*.zip
            .build/win32-x64/user-setup/*.exe
          fail_on_unmatched_files: true
